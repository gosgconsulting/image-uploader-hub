<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Continue to Shopify</title>
</head>
<body style="font-family:system-ui,sans-serif;padding:1.25rem;color:#111">
  <p>Opening Shopify to authorize the app...</p>
  <script>
    (function () {
      var p = new URLSearchParams(window.location.search);
      var u = p.get("authorize");
      var shop = p.get("shop");
      var claim = p.get("shopify_claim");
      if (shop && claim) {
        try {
          sessionStorage.setItem("shopify_pending_claim_shop", shop);
          sessionStorage.setItem("shopify_pending_claim_nonce", claim);
        } catch (e) {}
      }
      if (!u) return;
      try {
        var url = new URL(u);
        if (url.protocol !== "https:") return;
        if (!url.hostname.endsWith(".myshopify.com")) return;
        if (url.pathname.indexOf("/admin/oauth/authorize") === -1) return;
        if (window.top && window.top !== window.self) {
          window.top.location.replace(u);
        } else {
          window.location.replace(u);
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
